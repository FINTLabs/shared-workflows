name: Reusable Deploy Workflow
on:
  workflow_call:
    inputs:
      tags: 
        required: true
        type: string
      environment:
        required: true
        type: string
      deploy-every-branch:
        required: false
        type: boolean
        default: false
      org:
        required: false
        type: string
        default: ''

jobs:
  deploy-to-aks:
    name: deploy
    environment: ${{ inputs.org && format('{0} ({1})', inputs.org, inputs.environment) || inputs.environment }}
    if: >-
      github.actor != 'dependabot[bot]' &&
      (
        github.ref == format('refs/heads/{0}', github.event.repository.default_branch) ||
        inputs.deploy-every-branch == true
      )
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set image
        working-directory: kustomize/overlays/${{ inputs.org && format('{0}/{1}', inputs.org, inputs.environment) || inputs.environment }}
        run: kustomize edit set image "$(head -n 1 <<< '${{ inputs.tags }}')"

      - name: Bake manifests with Kustomize
        id: manifest
        uses: azure/k8s-bake@v4
        with:
          renderEngine: kustomize
          kustomizationPath: kustomize/overlays/${{ inputs.org && format('{0}/{1}', inputs.org, inputs.environment) || inputs.environment }}

      - name: Login to Azure
        uses: azure/login@v3
        with:
          creds: "${{ secrets[format('AKS_{0}_FINT_GITHUB', inputs.environment)] }}"

      - name: Set the target cluster
        uses: azure/aks-set-context@v5
        with:
          cluster-name: ${{ vars[format('{0}_CLUSTER_NAME', inputs.environment)] }}
          resource-group: ${{ vars[format('{0}_CLUSTER_RESOURCE_GROUP', inputs.environment)] }}
          admin: true

      - name: Get namespace from manifest
        id: namespace
        run: |
          namespace=$(yq '.metadata.namespace' "${{ steps.manifest.outputs.manifestsBundle }}" | head -n 1 | sed 's/^null$/default/')
          echo "name=$namespace" >> $GITHUB_OUTPUT

      - name: Deploy to Kubernetes
        uses: azure/k8s-deploy@v7
        with:
          action: deploy
          manifests: ${{ steps.manifest.outputs.manifestsBundle }}
          namespace: ${{ steps.namespace.outputs.name }}
