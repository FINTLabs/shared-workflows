name: Publish major version release

on:
  release:
    types:
      - published
  workflow_call:

permissions:
  contents: write

jobs:
  publish-major:
    runs-on: ubuntu-latest
    if: github.event.release && startsWith(github.event.release.tag_name, 'v')

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ github.event.release.tag_name }}

      - name: Determine major version
        id: major
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          minor="${{ github.event.release.tag_name }}"
          is_prerelease="${{ github.event.release.prerelease }}"
          is_draft="${{ github.event.release.draft }}"

          if [ "$is_prerelease" = "true" ] || [ "$is_draft" = "true" ]; then
            echo "Skipping pre-release or draft: $minor"
            exit 0
          fi

          if [[ "$minor" =~ ^v([0-9]+)\.[0-9]+$ ]]; then
            major="v${BASH_REMATCH[1]}"
            echo "major=$major" >> "$GITHUB_OUTPUT"
            echo "minor=$minor" >> "$GITHUB_OUTPUT"
            echo "Major version: $major"
            echo "Minor version: $minor"
          else
            echo "Tag $minor is not a minor release. Skipping."
            exit 0
          fi

      - name: Create or update major version release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MAJOR: ${{ steps.major.outputs.major }}
          MINOR: ${{ steps.major.outputs.minor }}
        run: |
          set -euo pipefail

          if [ -z "$MAJOR" ]; then
            exit 0
          fi

          target=$(git rev-parse HEAD)

          gh release delete "$MAJOR" --yes --cleanup-tag 2>/dev/null || true
          git tag -d "$MAJOR" 2>/dev/null || true

          echo "This release tracks the latest $MAJOR.x release ($MINOR)." > major-release-notes.md

          gh release create "$MAJOR" \
            --latest=false \
            --target "$target" \
            --title "$MAJOR" \
            --notes-file major-release-notes.md
